<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼국지 왕전</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* [경량화] HTML 인라인 스타일 소거 및 공통 액티브 버튼 위임 */
        .action-btn { padding: 9px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; transition: opacity 0.15s ease; border: none; color: #fff; }
        .action-btn:hover { opacity: 0.85; }
        .btn-local { background-color: #b82d2d; }
        .btn-cloud { background-color: #f97316; }
        .btn-export { background-color: #28a745; }
        .btn-import { background-color: #17a2b8; }
    </style>
</head>
<body>
    <header class="top-title-header">
        <h1>삼국지 왕전</h1>
        <span class="author-text">by JHP</span>
    </header>

    <script src="navbar.js"></script>

    <!-- 상단 제어 버튼 컴포넌트 레이어 -->
    <div style="max-width: 1200px; margin: 20px auto 0 auto; padding: 0 20px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;">
        <button id="save-btn" class="action-btn btn-local" onclick="saveData()">로컬 기록 저장</button>
        <button id="firebase-save-btn" class="action-btn btn-cloud">☁️ 클라우드 동기화</button>
        <button id="export-btn" class="action-btn btn-export" onclick="exportData()">데이터 영구 백업 (내보내기)</button>
        <button id="import-btn" class="action-btn btn-import" onclick="triggerImport()">데이터 즉시 복구 (가져오기)</button>
        <input type="file" id="import-file-input" style="display: none;" onchange="importData(this)">
    </div>
    
    <main class="container">
        <section class="section-box">
            <h2>장수 현황</h2>
            
            <div class="group-title wei">위나라</div>
            <div class="grid-container" id="hero-container-wei"></div>

            <div class="group-title shu">촉나라</div>
            <div class="grid-container" id="hero-container-shu"></div>

            <div class="group-title wu">오나라</div>
            <div class="grid-container" id="hero-container-wu"></div>

            <!-- [용어 정규화] 군나라 -> 군진영 교정 -->
            <div class="group-title qun">군진영</div>
            <div class="grid-container" id="hero-container-qun"></div>
        </section>

        <section class="section-box">
            <h2>전법 현황</h2>
            <div class="grid-container" id="tactic-container"></div>
        </section>
    </main>

    <script src="app.js"></script>

    <!-- Firebase Cloud Firestore 연동 모듈 (Web SDK v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSy_YOUR_API_KEY_HERE",
            authDomain: "your-project-id.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project-id.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('firebase-save-btn').addEventListener('click', async () => {
            try {
                const hobbyData = localStorage.getItem('samguk_hobby_data');
                const deckText = localStorage.getItem('samguk_deck_text');

                if (!hobbyData && !deckText) {
                    alert("클라우드에 동기화할 로컬 데이터가 없습니다. 먼저 '로컬 기록 저장'을 진행해 주세요.");
                    return;
                }

                const syncData = {
                    hobbyData: hobbyData ? JSON.parse(hobbyData) : null,
                    deckText: deckText ? JSON.parse(deckText) : null,
                    lastUpdated: new Date().toISOString()
                };

                await setDoc(doc(db, "users", "master_account"), syncData);
                alert("☁️ 클라우드 동기화 완료! 데이터가 안전하게 서버에 덮어씌워졌습니다.");
            } catch (error) {
                console.error("Firebase Sync Error: ", error);
                alert("동기화 실패: 파이어베이스 설정 및 보안 규칙을 확인해 주십시오.\n" + error.message);
            }
        });
    </script>
</body>
</html>
