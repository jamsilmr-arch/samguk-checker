<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼국지 왕전</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-title-header">
        <h1>삼국지 왕전</h1>
        <span class="author-text">by JHP</span>
    </header>

    <script src="navbar.js"></script>
    
    <main class="container" style="margin-top: 25px;">
        <section class="section-box">
            <h2>장수 현황</h2>
            <div class="group-title wei">위나라</div><div class="grid-container" id="hero-container-wei"></div>
            <div class="group-title shu">촉나라</div><div class="grid-container" id="hero-container-shu"></div>
            <div class="group-title wu">오나라</div><div class="grid-container" id="hero-container-wu"></div>
            <div class="group-title qun">군진영</div><div class="grid-container" id="hero-container-qun"></div>
        </section>
        <section class="section-box">
            <h2>전법 현황</h2><div class="grid-container" id="tactic-container"></div>
        </section>
    </main>

    <script src="app.js"></script>

    <!-- Firebase Auth 및 Firestore 통합 구글 동기화 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMJ96D8OBfivUXFs-jJhjt7DxlPTBrThs",
            authDomain: "samguk-checker.firebaseapp.com",
            databaseURL: "https://samguk-checker-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "samguk-checker",
            storageBucket: "samguk-checker.firebasestorage.app",
            messagingSenderId: "653002634547",
            appId: "1:653002634547:web:242c1bbb4c169b3fa6fa46",
            measurementId: "G-6TVYWWVSMK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.handleGoogleSync = async () => {
            if (window.saveDataToLocalStorage) window.saveDataToLocalStorage();
            
            const hobbyData = localStorage.getItem('samguk_hobby_data');
            const deckText = localStorage.getItem('samguk_deck_text');

            if (!hobbyData && !deckText) {
                throw new Error("동기화할 로컬 데이터가 없습니다. 먼저 장수나 전법을 체크해 주세요.");
            }

            // 1. 로그인 세션 확인 및 팝업 유도
            let user = auth.currentUser;
            if (!user) {
                try {
                    const result = await signInWithPopup(auth, provider);
                    user = result.user;
                } catch (error) {
                    throw new Error("구글 로그인이 취소되었거나 팝업이 차단되었습니다. 팝업 차단을 해제해 주세요.");
                }
            }

            // 2. 유저별 고유 식별자(UID)를 기반으로 데이터 구조화
            const syncData = {
                hobbyData: hobbyData ? JSON.parse(hobbyData) : null,
                deckText: deckText ? JSON.parse(deckText) : null,
                lastUpdated: new Date().toISOString(),
                userEmail: user.email // 추후 관리를 위한 메일 주소 동기화
            };

            // 3. 공용 폴더가 아닌, 유저 고유의 격리된 폴더(user.uid)에 저장
            await setDoc(doc(db, "users", user.uid), syncData);
            alert(`☁️ [${user.email}] 계정에 동기화 완료!\n본인의 데이터가 외부와 완벽히 격리되어 저장되었습니다.`);
        };
    </script>
</body>
</html>
