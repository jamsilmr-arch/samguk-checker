<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼국지 왕전 - 시스템 가이드</title>
    <link rel="stylesheet" href="guide.css">
</head>
<body>
    <header class="top-title-header">
        <h1>삼국지 왕전</h1>
        <span class="author-text">by JHP</span>
    </header>

    <!-- 공통 내비게이션 바 중앙 제어 엔진 도킹 (동기식 정위치 결선) -->
    <script src="navbar.js"></script>

    <main class="guide-main-container">
        <aside class="guide-sidebar" role="tablist" aria-label="가이드 카테고리">
            <button class="guide-tab-btn active" role="tab" onclick="switchGuideTab('equip', this)">장비 시스템</button>
            <button class="guide-tab-btn" role="tab" onclick="switchGuideTab('hawk', this)">매 시스템</button>
            <button class="guide-tab-btn" role="tab" onclick="switchGuideTab('officer', this)">무장 시스템</button>
            <button class="guide-tab-btn" role="tab" onclick="switchGuideTab('status', this)">속성 및 상태 이상</button>
        </aside>
        
        <section class="guide-content-area" id="guide-content-box" role="tabpanel">
            <!-- guide.js 엔진이 실시간 동적 데이터를 주입하는 연산 공간 -->
        </section>
    </main>

    <script src="guide.js"></script>
    
    <!-- 중앙 통제형 Firebase 모듈 1줄 로드 -->
    <script type="module" src="firebase_core.js"></script>
</body>
</html>
