<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼국지 왕전 - 덱 구성</title>
    <link rel="stylesheet" href="deck.css">
</head>
<body>
    <header class="top-title-header">
        <h1>삼국지 왕전</h1>
        <span class="author-text">by JHP</span>
    </header>

    <script src="navbar.js"></script>

    <div class="deck-main-container" style="margin-top: 20px; margin-bottom: 0; flex-direction: row; flex-wrap: wrap; gap: 10px;">
        <button id="sort-default-btn" class="control-sort-btn active" style="cursor: default; padding: 9px 18px; border-radius: 4px; font-weight: bold; font-size: 13px; border: none; background-color: #f8fafc; color: #111827;">부대 순서 고정 (1군~5군)</button>
    </div>

    <main class="deck-main-container" id="deck-container" style="margin-top: 15px;"></main>

    <script src="deck_core.js"></script>
    
    <!-- Firebase Cloud Firestore 통신 모듈 (deck.html 용) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // [🚨필수 조치] 아래 firebaseConfig의 임시 텍스트를 반드시 본인의 진짜 파이어베이스 설정값으로 교체하세요!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "your-project-id.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project-id.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleGoogleSync = async () => {
            const hobbyData = localStorage.getItem('samguk_hobby_data');
            const deckText = localStorage.getItem('samguk_deck_text');

            if (!hobbyData && !deckText) {
                throw new Error("구글 계정에 동기화할 로컬 데이터가 없습니다. 먼저 부대를 세팅해 주세요.");
            }

            const syncData = {
                hobbyData: hobbyData ? JSON.parse(hobbyData) : null,
                deckText: deckText ? JSON.parse(deckText) : null,
                lastUpdated: new Date().toISOString()
            };

            await setDoc(doc(db, "users", "master_account"), syncData);
            alert("☁️ 구글 계정 동기화 완료! 덱 구성 데이터가 안전하게 서버에 저장되었습니다.");
        };
    </script>
</body>
</html>
