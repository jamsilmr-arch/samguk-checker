<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼국지 왕전 - 메타 덱</title>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .top-title-header { padding: 20px 30px; display: flex; align-items: baseline; gap: 10px; }
        .top-title-header h1 { margin: 0; font-size: 24px; }
        .main-content { padding: 30px; max-width: 1400px; margin: 0 auto; min-height: 80vh; }
    </style>
</head>
<body>
    <!-- 상단 헤더 (navbar.js가 이 아래에 메뉴를 자동 삽입합니다) -->
    <header class="top-title-header">
        <h1>삼국지 왕전</h1>
        <span class="author-text" style="font-size: 14px; color: var(--text-muted);">by JHP</span>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-content">
        <!-- meta_deck.js가 실전 메타 덱 리스트를 그려넣을 도화지 공간 -->
        <div id="meta-deck-container"></div>
    </main>

    <!-- 필수 스크립트 연결 (순서 유지) -->
    <script type="module" src="firebase_core.js"></script>
    <script src="navbar.js"></script>
    <script src="meta_deck.js"></script>
</body>
</html>
